name: Deploy Atelier Vance to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble static production site
        run: |
          mkdir -p dist/assets dist/public/bundle dist/public/assets
          cp index.html dist/index.html
          cp -r public/assets/* dist/assets/ || true
          cp -r public/assets/* dist/public/assets/ || true
          cp public/bundle/atelier-vance.js dist/assets/atelier-vance.js || true
          cp public/bundle/atelier-vance.css dist/assets/atelier-vance.css || true
          cp public/bundle/atelier-vance.js dist/public/bundle/atelier-vance.js || true
          cp public/bundle/atelier-vance.css dist/public/bundle/atelier-vance.css || true
          cp public/studio-photos-cache.js dist/studio-photos-cache.js || true
          cp public/studio-photos-cache.js dist/public/studio-photos-cache.js || true
          cp public/gh-pages-loader.js dist/gh-pages-loader.js || true
          cp public/gh-pages-loader.js dist/public/gh-pages-loader.js || true
          cp -r src dist/src || true
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
