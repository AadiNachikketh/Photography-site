<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atelier Vance — Photography Studio & Production House</title>
    <meta name="description" content="High-fashion, architectural, and commercial photography studio featuring a medium-format portfolio gallery, client booking engine, and backend portfolio CMS." />
    <meta property="og:title" content="Atelier Vance — Photography Studio & Production House" />
    <meta property="og:description" content="High-fashion, architectural, and commercial photography studio featuring a medium-format portfolio gallery, client booking engine, and backend portfolio CMS." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      window.__loadPrebuiltAtelierVance = function () {
        if (window.__atelierVanceBundleLoaded) return;
        window.__atelierVanceBundleLoaded = true;
        var cssLink = document.createElement('link');
        cssLink.rel = 'stylesheet';
        cssLink.href = './public/bundle/atelier-vance.css';
        document.head.appendChild(cssLink);

        var jsScript = document.createElement('script');
        jsScript.type = 'module';
        jsScript.src = './public/bundle/atelier-vance.js';
        document.body.appendChild(jsScript);
      };
      if (window.location.hostname.indexOf('github.io') !== -1) {
        window.addEventListener('DOMContentLoaded', function () {
          if (!document.querySelector('script[src*="atelier-vance.js"]')) {
            window.__loadPrebuiltAtelierVance();
          }
        });
      }
    </script>
  </head>
  <body class="bg-[#070708] text-[#F4F4F0] antialiased selection:bg-[#E5A93C] selection:text-[#070708]">
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
      onerror="window.__loadPrebuiltAtelierVance && window.__loadPrebuiltAtelierVance()"
    ></script>
  </body>
</html>
